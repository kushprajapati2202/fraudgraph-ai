# Continuous deployment: run by the Cloud Build trigger on every push to main (scripts/setup-autodeploy.sh).
# Tests gate the release; the deploy changes only the image, so the env vars, secrets, service account and
# limits set by scripts/deploy.sh stay as they are.
substitutions:
  _REGION: us-central1
  _SERVICE: fraudgraph-ai
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: sh
    args:
      - -c
      - pip install --quiet --no-cache-dir -r requirements-dev.txt && python -m pytest backend/tests -q -p no:cacheprovider

  - id: build
    name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}:${SHORT_SHA}', -t, '${_IMAGE}:latest', .]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, deploy, '${_SERVICE}', --image, '${_IMAGE}:${SHORT_SHA}', --region, '${_REGION}', --quiet]

  - id: health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        URL="$(gcloud run services describe ${_SERVICE} --region ${_REGION} --format 'value(status.url)')"
        for i in 1 2 3 4 5 6; do
          curl -fsS "$$URL/api/health" && echo && echo "Live: $$URL (${SHORT_SHA})" && exit 0
          sleep 10
        done
        echo "Health check failed: $$URL/api/health" && exit 1

timeout: 1800s
options:
  dynamicSubstitutions: true  # _IMAGE is built from _REGION and _SERVICE
  logging: CLOUD_LOGGING_ONLY  # default e2-standard-2 machine: inside the Cloud Build free tier
